<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Books Category — BookShelf</title>
<style>
:root{
  --accent:#FF6B6B;
  --accent2:#FFD166;
  --muted:#e0e0e0;
  --glass: rgba(255,255,255,0.15);
  --radius:18px;
  --shadow:0 15px 35px rgba(0,0,0,0.5);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{
  color:#fff;
  min-height:100vh;
  background: url('images/image12.jpeg') center/cover no-repeat fixed;
  display:flex;
  flex-direction:column;
  position:relative;
}
body::before{
  content:''; position:absolute; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.55);
  z-index:-1;
}
/* NAVBAR */
.nav{display:flex; justify-content:space-between; align-items:center; padding:20px 40px; backdrop-filter:blur(8px); background:linear-gradient(90deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02)); position:relative; z-index:1;}
.brand{display:flex; align-items:center; gap:12px;}
.logo{width:50px;height:50px;border-radius:12px;background:linear-gradient(135deg,#FF6B6B,#FFD166);display:flex;align-items:center;justify-content:center;color:#1b1b1b;font-weight:700;font-family:'Playfair Display', serif;font-size:24px;}
.brand h1{margin:0;font-size:20px;letter-spacing:1px;}
.nav-links{display:flex;gap:20px;align-items:center;}
.nav-links a{color:rgba(255,255,255,0.95);text-decoration:none;font-weight:600;position:relative;transition:0.3s;}
.nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;width:0%;height:2px;background:var(--accent);transition:0.3s;}
.nav-links a:hover::after{width:100%;}
/* HERO */
.hero{text-align:center;padding:80px 20px 20px;}
.hero h2{font-family:'Playfair Display', serif;font-size:42px;line-height:1.1;}
.hero h2 span{color:var(--accent);}
.hero p.lead{color:var(--muted);font-size:18px;max-width:700px;margin:10px auto;}
/* BOOK GRID */
.container{width:90%;margin:40px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:25px;position:relative;z-index:1;}
.book-box{background:var(--glass);backdrop-filter:blur(10px);border-radius:var(--radius);padding:15px;text-align:center;box-shadow:var(--shadow);transition:0.4s;cursor:pointer;}
.book-box:hover{transform:translateY(-10px) scale(1.05);background: rgba(255,255,255,0.25);}
.book-img{width:140px;height:200px;object-fit:cover;border-radius:12px;margin-bottom:10px;box-shadow:0 5px 15px rgba(0,0,0,0.5);transition:0.3s;}
.book-box:hover .book-img{transform:scale(1.07);}
.book-title{font-size:16px;font-weight:600;color:var(--accent2);}
/* Footer */
footer{margin-top:auto;text-align:center;padding:20px;color:rgba(255,255,255,0.75);}
</style>
</head>
<body>
<nav class="nav">
  <div class="brand"><div class="logo">B</div><div><h1>BookShelf</h1><div style="font-size:12px;color:rgba(255,255,255,0.75)">Read • Collect • Discover</div></div></div>
  <div class="nav-links">
    <a href="home.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="books_category.html">Books</a>
    <a href="cart.html">Cart</a>
    <a href="login.html">Login</a>
    <a href="signup.html">Sign Up</a>
  </div>
</nav>
<header class="hero">
  <h2>📚 Explore <span>Books</span></h2>
  <p class="lead">Browse your favorite books and see their details.</p>
</header>
<div class="container" id="booksContainer">
  <p style="grid-column:1/-1; text-align:center; font-size:20px; color:var(--muted);">Loading books from database...</p>
</div>
<footer>
  © BookShelf — Made with ♥ by BookShelf Team
</footer>

<script>

fetch('get_books.php')
  .then(response => response.json())
  .then(books => {
    const container = document.getElementById('booksContainer');
    container.innerHTML = '';

    if (books.length === 0) {
      container.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:var(--muted);">No books available.</p>';
      return;
    }

    books.forEach(book => {
      const div = document.createElement('div');
      div.className = 'book-box';
      div.innerHTML = `
        <img src="${book.cover}" class="book-img" alt="${book.title}">
        <div class="book-title">${book.title}</div>
      `;
      div.addEventListener('click', () => {
        // book object poora save karo (id ke saath)
        localStorage.setItem('selectedBook', JSON.stringify(book));
        window.location.href = 'books_detail.html';
      });
      container.appendChild(div);
    });
  })
  .catch(err => {
    console.error(err);
    document.getElementById('booksContainer').innerHTML = '<p style="grid-column:1/-1; text-align:center; color:red;">Error loading books.</p>';
  });
</script>
</body>
</html>
