<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Details — BookShelf</title>
<style>
:root{
  --accent:#FF6B6B;
  --accent2:#FFD166;
  --muted:#e0e0e0;
  --glass: rgba(255,255,255,0.15);
  --radius:18px;
  --shadow:0 15px 35px rgba(0,0,0,0.5);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{
  color:#fff;
  min-height:100vh;
  background: url('images/image12.jpeg') center/cover no-repeat fixed;
  display:flex;
  flex-direction:column;
  position:relative;
}
body::before{
  content:''; position:absolute; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.55);
  z-index:-1;
}
.nav{
  display:flex; justify-content:space-between; align-items:center; padding:20px 40px; backdrop-filter:blur(8px); background:linear-gradient(90deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
}
.brand{display:flex; align-items:center; gap:12px;}
.logo{width:50px;height:50px;border-radius:12px;background:linear-gradient(135deg,#FF6B6B,#FFD166);display:flex;align-items:center;justify-content:center;color:#1b1b1b;font-weight:700;font-family:'Playfair Display', serif;font-size:24px;}
.brand h1{margin:0;font-size:20px;letter-spacing:1px;}
.nav-links{display:flex;gap:20px;align-items:center;}
.nav-links a{color:rgba(255,255,255,0.95);text-decoration:none;font-weight:600;transition:0.3s;}
.nav-links a:hover{color:var(--accent);}
.detail-container{
  width:90%;
  max-width:800px;
  margin:40px auto;
  background:var(--glass);
  backdrop-filter:blur(10px);
  border-radius:var(--radius);
  padding:40px;
  box-shadow:var(--shadow);
  text-align:center;
}
.book-cover{
  width:300px;
  height:450px;
  object-fit:cover;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,0.6);
  margin-bottom:30px;
}
.book-detail-title{font-size:36px;font-weight:700;color:var(--accent2);margin-bottom:10px;}
.book-author{font-size:24px;color:var(--muted);margin-bottom:20px;}
.book-price{font-size:32px;color:var(--accent);font-weight:700;margin-bottom:30px;}
.add-to-cart-btn{
  background: var(--accent);
  color: white;
  padding:15px 40px;
  font-size:18px;
  font-weight:600;
  border:none;
  border-radius:14px;
  cursor:pointer;
  transition:0.3s;
}
.add-to-cart-btn:hover{
  background:#ff5252;
  transform:scale(1.05);
}
.login-prompt{
  background:rgba(255,107,107,0.2);
  padding:20px;
  border-radius:12px;
  margin-top:20px;
  color:var(--accent2);
}
footer{
  margin-top:auto;
  text-align:center;
  padding:20px;
  color:rgba(255,255,255,0.75);
}
</style>
</head>
<body>
<nav class="nav">
  <div class="brand"><div class="logo">B</div><div><h1>BookShelf</h1><div style="font-size:12px;color:rgba(255,255,255,0.75)">Read • Collect • Discover</div></div></div>
  <div class="nav-links">
    <a href="home.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="books_category.html">Books</a>
    <a href="cart.html">Cart</a>
    <a href="login.html">Login</a>
    <a href="signup.html">Sign Up</a>
  </div>
</nav>
<div class="detail-container" id="bookDetail">
  <p>Loading book details...</p>
</div>
<footer>
  © BookShelf — Made with ♥ by BookShelf Team
</footer>
<script>
const bookJSON = localStorage.getItem('selectedBook');
let book;
if (!bookJSON) {
  document.getElementById('bookDetail').innerHTML = '<p>No book selected. Go back to books list.</p>';
} else {
  book = JSON.parse(bookJSON);
  document.getElementById('bookDetail').innerHTML = `
    <img src="${book.cover}" class="book-cover" alt="${book.title}">
    <div class="book-detail-title">${book.title}</div>
    <div class="book-author">by ${book.author}</div>
    <div class="book-price">${book.price}</div>
    <button class="add-to-cart-btn" onclick="addToCart()">Add to Cart</button>
    <div class="login-prompt" id="loginPrompt" style="display:none;">
      Please <a href="login.html" style="color:var(--accent2);text-decoration:underline;">login</a> to add to cart.
    </div>
  `;
}
function addToCart() {
  if (!book || !book.id) {
    alert('Book ID not found');
    return;
  }
  fetch('add_to_cart.php', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({book_id: book.id})
  })
  .then(response => response.json())
  .then(data => {
    if (data.success) {
      alert(data.message);
    } else {
      document.getElementById('loginPrompt').style.display = 'block';
      alert(data.message || 'Please login first');
    }
  })
  .catch(err => {
    console.error(err);
    alert('Error adding to cart');
  });
}
</script>
</body>
</html>
