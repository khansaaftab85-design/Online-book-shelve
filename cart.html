<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart — BookShelf</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
:root{
  --accent:#FF6B6B;
  --accent2:#FFD166;
  --muted:#e0e0e0;
  --glass: rgba(255,255,255,0.15);
  --radius:18px;
  --shadow:0 15px 35px rgba(0,0,0,0.5);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{
  color:#fff;
  min-height:100vh;
  background: url('images/image12.jpeg') center/cover no-repeat fixed;
  display:flex;
  flex-direction:column;
}
body::before{
  content:''; position:absolute; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.55);
  z-index:-1;
}
/* NAVBAR */
.nav{
  display:flex; justify-content:space-between; align-items:center;
  padding:20px 40px; backdrop-filter:blur(8px);
  background:linear-gradient(90deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
  position:relative; z-index:1;
}
.brand{display:flex; align-items:center; gap:12px;}
.logo{
  width:50px; height:50px; border-radius:12px;
  background:linear-gradient(135deg,#FF6B6B,#FFD166);
  display:flex; align-items:center; justify-content:center;
  color:#1b1b1b; font-weight:700; font-family:'Playfair Display', serif; font-size:24px;
}
.brand h1{margin:0; font-size:20px; letter-spacing:1px;}
.nav-links{display:flex; gap:20px; align-items:center;}
.nav-links a{
  color:rgba(255,255,255,0.95); text-decoration:none; font-weight:600; position:relative;
  transition:0.3s;
}
.nav-links a::after{
  content:''; position:absolute; bottom:-4px; left:0; width:0%; height:2px; background:var(--accent); transition:0.3s;
}
.nav-links a:hover::after{width:100%;}
/* HERO */
.hero{
  text-align:center;
  padding:60px 20px 20px;
}
.hero h2{
  font-family:'Playfair Display', serif; font-size:42px; line-height:1.1;
}
.hero h2 span{color:var(--accent);}
.hero p.lead{
  color:var(--muted); font-size:18px; max-width:700px; margin:10px auto;
}
/* CART TABLE */
.cart-container{
  width:90%;
  max-width:1000px;
  margin:40px auto;
  background:var(--glass);
  backdrop-filter:blur(12px);
  border-radius:var(--radius);
  padding:25px;
  box-shadow:var(--shadow);
  position:relative; z-index:1;
}
.cart-table{
  width:100%;
  border-collapse:collapse;
}
.cart-table th, .cart-table td{
  padding:12px 15px;
  text-align:left;
}
.cart-table th{
  color:var(--accent2);
  font-size:18px;
}
.cart-table td{
  color:#fff;
  font-size:16px;
  vertical-align:middle;
}
.cart-img{
  width:60px;
  height:80px;
  object-fit:cover;
  border-radius:8px;
}
.remove-btn{
  padding:6px 12px;
  border:none;
  border-radius:12px;
  background:#FF6B6B;
  color:#fff;
  cursor:pointer;
  transition:0.3s;
}
.remove-btn:hover{
  transform:scale(1.05);
}
.checkout-btn{
  margin-top:20px;
  padding:12px 25px;
  border:none;
  border-radius:14px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:white;
  font-weight:700;
  cursor:pointer;
  transition:0.3s;
}
.checkout-btn:hover{
  transform:scale(1.05);
  box-shadow:0 8px 25px rgba(255,107,107,0.5);
}
footer{
  margin-top:auto;
  text-align:center;
  padding:20px;
  color:rgba(255,255,255,0.75);
}
/* Back Link */
.back{
  text-align:center;
  margin-top:20px;
}
.back a{
  padding:12px 22px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:white;
  border-radius:12px;
  text-decoration:none;
  font-weight:bold;
  transition:0.3s;
}
.back a:hover{
  transform:scale(1.05);
}
</style>
</head>
<body>
<!-- NAVBAR -->
<nav class="nav">
  <div class="brand">
    <div class="logo">B</div>
    <div>
      <h1>BookShelf</h1>
      <div style="font-size:12px;color:rgba(255,255,255,0.75)">Read • Collect • Discover</div>
    </div>
  </div>
  <div class="nav-links">
    <a href="home.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="books_category.html">Books</a>
    <a href="cart.html">Cart</a>
    <a href="login.html">Login</a>
    <a href="signup.html">Sign Up</a>
  </div>
</nav>
<!-- HERO -->
<header class="hero">
  <h2>Your <span>Cart</span></h2>
  <p class="lead">Review your selected books before checkout.</p>
</header>
<!-- CART CONTENT -->
<div class="cart-container" id="cartContainer">
  <p style="text-align:center; font-size:18px; color:var(--muted);">Loading your cart...</p>
</div>
<!-- Back Link -->
<div class="back">
  <a href="books_category.html">⬅ Back to Books</a>
</div>
<footer>
  © BookShelf — Made with ♥ by BookShelf Team
</footer>

<script>
function loadCart() {
  fetch('get_cart.php')
    .then(response => response.json())
    .then(cart => {
      const container = document.getElementById('cartContainer');
      container.innerHTML = '';

      if (cart.length === 0) {
        container.innerHTML = `<p style="text-align:center; font-size:18px; color:var(--muted)">Your cart is empty.</p>`;
        return;
      }

      let tableHTML = `
        <table class="cart-table">
          <tr>
            <th>Cover</th>
            <th>Title</th>
            <th>Author</th>
            <th>Price</th>
            <th>Action</th>
          </tr>
      `;

      let total = 0;

      cart.forEach(book => {
        total += parseFloat(book.price.replace('$', ''));
        tableHTML += `
          <tr>
            <td><img src="${book.cover}" class="cart-img" alt="${book.title}"></td>
            <td>${book.title}</td>
            <td>${book.author}</td>
            <td>${book.price}</td>
            <td><button class="remove-btn" onclick="removeFromCart(${book.id})">Remove</button></td>
          </tr>
        `;
      });

      tableHTML += `</table>`;
      tableHTML += `<div style="text-align:right; font-size:24px; color:var(--accent2); margin:20px 0;">Total: $${total.toFixed(2)}</div>`;
      tableHTML += `<a href="checkout.html"><button class="checkout-btn">Proceed to Checkout</button></a>`;

      container.innerHTML = tableHTML;
    })
    .catch(err => {
      console.error(err);
      document.getElementById('cartContainer').innerHTML = '<p style="text-align:center; color:red;">Error loading cart.</p>';
    });
}

function removeFromCart(bookId) {
  fetch('remove_from_cart.php', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({book_id: bookId})
  })
  .then(response => response.json())
  .then(data => {
    if (data.success) {
      loadCart();
    } else {
      alert('Error removing item');
    }
  });
}

// Load cart on page load
loadCart();
</script>
</body>
</html>
