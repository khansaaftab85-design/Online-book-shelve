<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookShelf — Contact Us</title>
<style>
:root{
  --accent:#FF6B6B;
  --accent2:#FFD166;
  --muted:#e0e0e0;
  --glass: rgba(255,255,255,0.15);
  --radius:18px;
  --shadow:0 15px 35px rgba(0,0,0,0.5);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto;
  color:#fff;
  min-height:100vh;
  background:url('images/image13.jpeg') center/cover no-repeat fixed;
  display:flex;
  flex-direction:column;
  padding-bottom:50px;
  position:relative;
  animation: softFade 1.2s ease-out;
}
@keyframes softFade{
  from{opacity:0;}
  to{opacity:1;}
}
body::before{
  content:''; position:absolute; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.72);
  z-index:-1;
}
/* NAVBAR */
.nav{
  display:flex; justify-content:space-between; align-items:center;
  padding:20px 40px; backdrop-filter:blur(10px);
  background:rgba(255,255,255,0.05);
  animation: navReveal 0.8s ease-out;
}
@keyframes navReveal{
  from{opacity:0; transform:translateY(-15px);}
  to{opacity:1; transform:translateY(0);}
}
.brand{display:flex; align-items:center; gap:12px;}
.logo{
  width:50px; height:50px; border-radius:12px;
  background:linear-gradient(135deg,#FF6B6B,#FFD166);
  display:flex; align-items:center; justify-content:center;
  color:#1b1b1b; font-weight:700; font-family:'Playfair Display', serif; font-size:24px;
}
.brand h1{margin:0; font-size:20px; letter-spacing:1px;}
.nav-links{display:flex; gap:20px; align-items:center;}
.nav-links a{
  color:rgba(255,255,255,0.95); text-decoration:none; font-weight:600; position:relative;
  transition:0.25s ease;
}
.nav-links a:hover{
  opacity:0.75;
}
/* HERO */
.hero{
  display:flex; flex-direction:column; align-items:center; text-align:center;
  padding:80px 8%; gap:20px;
}
.hero h2{
  font-family:'Playfair Display',serif;
  font-size:42px;
  line-height:1.1;
  color:#ffffff;
  animation: titleSlide 1.1s ease-out;
}
@keyframes titleSlide{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}
.hero h2 span{color:var(--accent);}
.hero p.lead{
  color:rgba(255,255,255,0.88);
  font-size:18px;
  max-width:700px;
  line-height:1.6;
  animation: textFade 1.4s ease-out;
}
@keyframes textFade{
  from{opacity:0; transform:translateY(18px);}
  to{opacity:1; transform:translateY(0);}
}
/* CONTACT FORM */
.contact-form{
  max-width:700px; margin:40px auto; padding:20px;
  background:var(--glass); backdrop-filter:blur(10px); border-radius:var(--radius); box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:15px;
  animation: formRise 1.2s ease-out;
}
@keyframes formRise{
  from{opacity:0; transform:translateY(30px);}
  to{opacity:1; transform:translateY(0);}
}
.contact-form label{
  color:#ffffff;
  font-weight:600;
}
.contact-form input, .contact-form textarea{
  padding:12px; border-radius:12px; border:none; outline:none;
  font-size:16px; font-family:Inter, sans-serif;
}
.contact-form button{
  padding:12px 25px; border-radius:14px; border:none;
  font-weight:700; background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:white; cursor:pointer; transition:0.25s;
}
.contact-form button:hover{
  transform:translateY(-2px);
  box-shadow:0 0 22px rgba(255,255,255,0.6);
}
/* Back to Home Button */
.back-home{
  margin-top:30px; display:block; text-align:center; padding:12px 25px;
  border:none; border-radius:14px; background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#fff; font-weight:700; cursor:pointer; transition:0.25s; text-decoration:none;
}
.back-home:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 30px rgba(255,107,107,0.5);
}
/* Footer */
footer{margin-top:auto; text-align:center; padding:20px; color:rgba(255,255,255,0.75);}
@media(max-width:600px){.contact-form{padding:15px;}}
</style>
</head>
<body>
<!-- NAVBAR -->
<nav class="nav">
  <div class="brand">
    <div class="logo">B</div>
    <div>
      <h1>BookShelf</h1>
      <div style="font-size:12px;color:rgba(255,255,255,0.75)">Read • Collect • Discover</div>
    </div>
  </div>
  <div class="nav-links">
    <a href="home.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="books_category.html">Books</a>
    <a href="cart.html">Cart</a>
    <a href="login.html">Login</a>
    <a href="signup.html">Sign Up</a>
  </div>
</nav>
<!-- HERO -->
<header class="hero">
  <h2>Contact <span>Us</span></h2>
  <p class="lead">Have questions or feedback? Reach out to us using the form below. We’d love to hear from you!</p>
</header>
<!-- CONTACT FORM -->
<div class="contact-form">
  <label for="name">Name</label>
  <input type="text" id="name" placeholder="Your Name" required>
  <label for="email">Email</label>
  <input type="email" id="email" placeholder="Your Email" required>
  <label for="message">Message</label>
  <textarea id="message" placeholder="Your Message" rows="5" required></textarea>
  <button onclick="submitForm()">Send Message</button>
</div>
<a href="home.html" class="back-home">⬅ Back to Home</a>
<footer>
  © BookShelf — Made with ♥ by BookShelf Team
</footer>
<script>
function submitForm() {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const message = document.getElementById('message').value.trim();

  if (!name || !email || !message) {
    alert('Please fill all fields!');
    return;
  }

  fetch('contact.php', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name, email, message})
  })
  .then(response => response.json())
  .then(data => {
    alert(data.message);
    if (data.success) {
      document.getElementById('name').value = '';
      document.getElementById('email').value = '';
      document.getElementById('message').value = '';
    }
  })
  .catch(err => {
    console.error(err);
    alert('Error sending message');
  });
}
</script>
</body>
</html>
