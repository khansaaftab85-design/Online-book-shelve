<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookShelf — Index</title>

<style>
:root {
  --accent: #FF6B6B;
  --accent2: #FFD166;
  --muted: #e0e0e0;
  --glass: rgba(255,255,255,0.15);
  --radius: 18px;
  --shadow: 0 15px 35px rgba(0,0,0,0.5);
}

* {margin:0; padding:0; box-sizing:border-box;}

body {
  font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto;
  color: rgba(255,255,255,0.9);
  min-height: 100vh;
  background: url('images/image16.jpeg') center/cover no-repeat fixed;
  display: flex;
  flex-direction: column;
  opacity: 0;
  animation: pageFade 1s forwards;
}

body::before {
  content: '';
  position: absolute; top:0; left:0; width:100%; height:100%;
  background: rgba(0,0,0,0);
  z-index: -1;
  opacity:1;
}

/* NAVBAR */
.nav {
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 40px;
  background: linear-gradient(90deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
  opacity: 0;
  transform: translateY(-50px);
  animation: navSlide 1s forwards;
  animation-delay: 0.2s;
}

.brand {
  display: flex; align-items: center; gap: 12px;
}

.logo {
  width: 50px; height: 50px; border-radius: 12px;
  background: linear-gradient(135deg,#FF6B6B,#FFD166);
  display: flex; align-items: center; justify-content: center;
  color: #1b1b1b; font-weight: 700; font-family:'Playfair Display', serif; font-size: 24px;
}

.brand h1 {
  margin:0; font-size:20px; letter-spacing:1px;
}

.nav-links {
  display: flex; gap: 20px; align-items: center;
}

.nav-links a {
  color: rgba(255,255,255,0.9);
  text-decoration: none; font-weight: 600; position: relative;
  transition: 0.35s;
  opacity: 0; transform: translateY(-15px);
  animation: fadeLinks 0.8s forwards;
}

.nav-links a:nth-child(1){animation-delay:0.35s;}
.nav-links a:nth-child(2){animation-delay:0.45s;}
.nav-links a:nth-child(3){animation-delay:0.55s;}
.nav-links a:nth-child(4){animation-delay:0.65s;}

.nav-links a::after {
  content: ''; position: absolute; bottom: -4px; left:0; width:0%; height:2px; background: var(--accent); transition:0.35s;
}
.nav-links a:hover::after {width: 100%;}

/* HERO */
.hero {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: 80px 8%; gap: 20px;
  opacity:0; transform: translateY(50px);
  animation: heroFade 1s forwards;
  animation-delay:0.4s;
}

.hero h2 {
  font-family: 'Playfair Display', serif; font-size: 42px; line-height: 1.1;
  opacity:0; transform: translateY(30px);
  animation: fadeGlow 1s forwards;
  animation-delay:0.6s;
}
.hero h2 span { color: var(--accent); }

/* HERO PARAGRAPH - WHITE TEXT */
.hero p.lead {
  color: #ffffff;       /* changed to white */
  font-weight:700;      
  text-shadow: 1px 1px 3px rgba(0,0,0,0.4); /* subtle black shadow for readability */
  font-size:18px; max-width:700px; line-height:1.6;
  opacity:0;
  transform:translateY(30px);
  animation:fadeText 1s forwards;
  animation-delay:0.8s;
}

/* Buttons Section */
.page-links {
  display:flex; gap:20px; flex-wrap:wrap; justify-content:center; margin-top:40px;
}
.page-links a {
  text-decoration:none; padding:14px 22px; border-radius:14px;
  background: linear-gradient(90deg,var(--accent),var(--accent2));
  color:#fff; font-weight:700; transition:0.35s;
  opacity:0; transform:translateY(30px) scale(0.95);
  animation: btnPop 0.8s forwards;
}
.page-links a:nth-child(1){ animation-delay:1s; }
.page-links a:nth-child(2){ animation-delay:1.1s; }
.page-links a:nth-child(3){ animation-delay:1.2s; }
.page-links a:hover { transform: scale(1.08); box-shadow: 0 12px 30px rgba(255,107,107,0.55); }

/* FOOTER - WHITE TEXT */
footer {
  margin-top:auto; text-align:center; padding:20px;
  color: #ffffff;      /* changed to white */
  font-weight:600;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.4); /* subtle black shadow */
  opacity:0; transform:translateY(20px);
  animation:fadeIn 1.2s forwards;
  animation-delay:1.6s;
}

/* Animations */
@keyframes pageFade{from{opacity:0;}to{opacity:1;}}
@keyframes navSlide{0%{opacity:0;transform:translateY(-50px);}100%{opacity:1;transform:translateY(0);}}
@keyframes fadeLinks{0%{opacity:0;transform:translateY(-15px);}100%{opacity:1;transform:translateY(0);}}
@keyframes heroFade{0%{opacity:0;transform:translateY(50px);}100%{opacity:1;transform:translateY(0);}}
@keyframes fadeGlow{0%{opacity:0;}100%{opacity:1;}}
@keyframes fadeText{0%{opacity:0;}100%{opacity:1;}}
@keyframes btnPop{0%{opacity:0;}100%{opacity:1;}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
</style>
</head>

<body>
<!-- NAVBAR -->
<nav class="nav">
  <div class="brand">
    <div class="logo">B</div>
    <div>
      <h1>BookShelf</h1>
      <div style="font-size:12px;color:rgba(255,255,255,0.75)">Read • Collect • Discover</div>
    </div>
  </div>

  <div class="nav-links">
    <a href="home.html">Home</a>
    <a href="login.html">Login</a>
    <a href="signup.html">Sign Up</a>
    <a href="login.html" onclick="logout()">Logout</a>
  </div>
</nav>

<!-- HERO -->
<header class="hero">
  <h2>Welcome to <span>BookShelf</span></h2>
  <p class="lead">Your ultimate online library. Browse books, read details, add to cart, and enjoy seamless reading experience.</p>
</header>

<!-- BUTTONS -->
<div class="page-links">
  <a href="signup.html">Sign Up</a>
  <a href="login.html">Login</a>
  <a href="login.html" onclick="logout()">Logout</a>
</div>

<!-- FOOTER -->
<footer>
  © BookShelf — Made with ♥ by BookShelf Team
</footer>

<script>
function logout(){
    alert("You have been logged out successfully!");
    window.location.href = "login.html";
}
</script>
</body>
</html>
